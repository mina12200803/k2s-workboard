<style>
/* Layout: 藍色のサイドバー + 作業面。スマホでは下部タブ。判子欄つきの申請書プレビューが主役 */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#EAEEF2; --line:#D8DFE6; --line-2:#C5CFD9;
  --ink:#14202B; --ink-2:#47566A; --ink-3:#7A8796;
  --accent:#1D4E89; --accent-ink:#FFFFFF; --accent-soft:#E2EBF6; --accent-strong:#163C6A;
  --side:#13263D; --side-ink:#D5E0EC; --side-ink-2:#8DA2B9; --side-hi:#22406A;
  --hanko:#C8372D; --hanko-soft:#FBE9E7;
  --ok:#1D7A57; --ok-soft:#E1F3EB; --warn:#9A6512; --warn-soft:#FBF0D9; --bad:#B83A33; --bad-soft:#FBE6E4;
  --c-red:#D9443B; --c-orange:#DE8A1E; --c-brown:#9A7656; --c-purple:#7D5BC4; --c-green:#2E9A62; --c-blue:#3270C9; --c-pink:#D2588E; --c-gray:#8592A0;
  --today:#FFF7E3; --weekend:#F6F8FA; --hol:#FCEEEE;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 8px 24px rgba(20,32,43,.08);
  --f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --r:10px;
}
@media not all{:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F28; --surface-2:#1D2833; --line:#283541; --line-2:#36485A;
  --ink:#E5ECF2; --ink-2:#A8B6C4; --ink-3:#7A8898;
  --accent:#78A9E4; --accent-ink:#0B1622; --accent-soft:#1B2D45; --accent-strong:#A2C4EE;
  --side:#0A121A; --side-ink:#D5E0EC; --side-ink-2:#7F93A8; --side-hi:#1B2F48;
  --hanko:#EF6A5E; --hanko-soft:#3A1E1C;
  --ok:#52C497; --ok-soft:#14322A; --warn:#E5B456; --warn-soft:#3A2D12; --bad:#F07F76; --bad-soft:#3D1D1B;
  --c-red:#EF6A60; --c-orange:#EDA344; --c-brown:#C29F7E; --c-purple:#A98BEB; --c-green:#55C488; --c-blue:#6B9FEA; --c-pink:#EB82AF; --c-gray:#95A2B0;
  --today:#2A2615; --weekend:#131B22; --hol:#2B1A1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark-disabled"]{
  --bg:#0E141A; --surface:#161F28; --surface-2:#1D2833; --line:#283541; --line-2:#36485A;
  --ink:#E5ECF2; --ink-2:#A8B6C4; --ink-3:#7A8898;
  --accent:#78A9E4; --accent-ink:#0B1622; --accent-soft:#1B2D45; --accent-strong:#A2C4EE;
  --side:#0A121A; --side-ink:#D5E0EC; --side-ink-2:#7F93A8; --side-hi:#1B2F48;
  --hanko:#EF6A5E; --hanko-soft:#3A1E1C;
  --ok:#52C497; --ok-soft:#14322A; --warn:#E5B456; --warn-soft:#3A2D12; --bad:#F07F76; --bad-soft:#3D1D1B;
  --c-red:#EF6A60; --c-orange:#EDA344; --c-brown:#C29F7E; --c-purple:#A98BEB; --c-green:#55C488; --c-blue:#6B9FEA; --c-pink:#EB82AF; --c-gray:#95A2B0;
  --today:#2A2615; --weekend:#131B22; --hol:#2B1A1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--side-ink);color:var(--side);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:13px;letter-spacing:-.02em}
.brand b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.2}
.brand small{color:var(--side-ink-2);font-size:11px;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--side-ink-2);text-align:left;font-weight:500}
.nav button:hover{color:var(--side-ink);background:rgba(255,255,255,.04)}
.nav button[aria-current="page"]{background:var(--side-hi);color:#fff}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--hanko);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.whoami{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.05);border:0;color:var(--side-ink);text-align:left;width:100%}
.whoami small{display:block;color:var(--side-ink-2);font-size:11px}
.mode-note{font-size:11px;color:var(--side-ink-2);padding:0 8px;line-height:1.5}
.main{min-width:0;padding-block:26px 48px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px))}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:26px;font-weight:900}
.page-head .sub{color:var(--ink-3);font-size:13px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabbar{display:none}
.fab{display:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--ink-3)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:500;color:var(--ink-2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
select.sel,input.inp,textarea.inp{height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0;width:100%}
textarea.inp{height:auto;padding:8px 10px;resize:vertical}
input.inp:focus,select.sel:focus,textarea.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .range{font-family:var(--f-display);font-weight:700;font-size:18px;min-width:0}
.toolbar .grow{flex:1}

/* ---------- cards / home ---------- */
.grid-home{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel>header h2{font-size:15px;font-weight:700}
.panel>header .more{margin-left:auto;font-size:12px;color:var(--accent);background:none;border:0;padding:0;font-weight:500}
.panel .body{padding:8px 18px 14px}
.empty{color:var(--ink-3);padding:18px 0;font-size:13px}
.hello{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{font-size:28px;font-weight:900}
.hello .date{color:var(--ink-2);font-family:var(--f-display);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
button.stat:hover{border-color:var(--accent)}
.stat .k{font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:.04em}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:900;line-height:1.2}
.stat .v small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:4px}
.stat.alert .v{color:var(--hanko)}
.agenda{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.agenda li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:start}
.agenda li:last-child{border-bottom:0}
.agenda .tm{font-weight:700;color:var(--ink-2);font-size:13px}
.agenda .ttl{display:block;font-weight:500;min-width:0;overflow-wrap:anywhere}
.agenda .meta{display:block;font-size:12px;color:var(--ink-3)}
.agenda button.lnk{all:unset;cursor:pointer;display:block}
.agenda button.lnk:hover .ttl{color:var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--cat,var(--c-gray))}
.trip-mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-bottom:1px dashed var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.trip-mini:last-child{border-bottom:0}
.trip-mini:hover b{color:var(--accent)}
.trip-mini .meta{font-size:12px;color:var(--ink-3);grid-column:1/-1}
.fac-list{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.fac-row{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.fac-row .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fac-row .use{display:flex;gap:6px;flex-wrap:wrap}
.free{color:var(--ink-3);font-size:12px}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pending{background:var(--warn-soft);color:var(--warn)}
.st-decided{background:var(--accent-soft);color:var(--accent)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-returned{background:var(--warn-soft);color:var(--warn)}
.st-rejected{background:var(--bad-soft);color:var(--bad)}
.st-withdrawn{background:var(--surface-2);color:var(--ink-3)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;font-family:var(--f-display)}
.av.sm{width:22px;height:22px;font-size:11px}

/* ---------- schedule week grid ---------- */
.cal-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.week{display:grid;grid-template-columns:150px repeat(7,minmax(118px,1fr));min-width:980px}
.week .h{position:sticky;top:0;background:var(--surface);z-index:1;padding:10px 10px 8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:13px}
.week .h:first-child{border-left:0}
.week .h .d{font-family:var(--f-display);font-weight:900;font-size:20px;line-height:1}
.week .h .w{color:var(--ink-3);font-weight:500;margin-left:4px}
.week .h .hn{display:block;font-size:11px;color:var(--bad);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week .h.sun .d,.week .h.hol .d{color:var(--bad)}
.week .h.sat .d{color:var(--c-blue)}
.week .h.is-today{background:var(--today)}
.week .h.is-today .d{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-size:16px;padding:0 6px}
.rowhead{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;font-weight:500;min-width:0;background:var(--surface)}
.rowhead .nm{min-width:0;overflow-wrap:anywhere;line-height:1.35}
.rowhead .nm small{display:block;color:var(--ink-3);font-size:11px;font-weight:400}
.rowhead.me{background:var(--accent-soft)}
.cell{position:relative;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px 6px 26px;min-height:78px;display:flex;flex-direction:column;gap:4px;cursor:copy;min-width:0}
.cell.weekend{background:var(--weekend)}
.cell.hol{background:var(--hol)}
.cell.is-today{background:var(--today)}
.cell .add{position:absolute;right:6px;bottom:4px;width:22px;height:22px;border-radius:6px;border:1px dashed var(--line-2);background:var(--surface);color:var(--ink-3);display:grid;place-items:center;opacity:0;transition:opacity .12s}
.cell:hover .add,.cell .add:focus-visible{opacity:1}
.band{background:color-mix(in srgb,var(--c-blue) 7%,var(--surface))}
.rowhead.band .nm{color:var(--c-blue);font-weight:700}
.band.cell{min-height:40px;padding-bottom:6px}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:4px 7px 4px 9px;font-size:12px;line-height:1.4;background:color-mix(in srgb,var(--cat) 14%,var(--surface));color:var(--ink);position:relative;overflow-wrap:anywhere;cursor:pointer}
.chip::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--cat)}
.chip:hover{background:color-mix(in srgb,var(--cat) 24%,var(--surface))}
.chip .t{font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.chip .x{display:block;font-size:11px;color:var(--ink-3)}
.chip.trip{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c-orange) 16%,var(--surface)) 0 6px,color-mix(in srgb,var(--c-orange) 9%,var(--surface)) 6px 12px)}
.chip.clash{outline:1.5px solid var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin-top:12px}

/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));min-width:800px}
.month .mh{padding:8px 10px;font-size:12px;font-weight:700;color:var(--ink-3);border-bottom:1px solid var(--line);text-align:left}
.month .mh.sun{color:var(--bad)} .month .mh.sat{color:var(--c-blue)}
.mcell{min-height:112px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:copy;min-width:0}
.mcell:nth-child(7n+1){border-left:0}
.mcell.out{background:var(--weekend);color:var(--ink-3)}
.mcell.out .chip{opacity:.6}
.mcell .dn{font-family:var(--f-display);font-weight:700;font-size:14px;display:flex;gap:6px;align-items:baseline}
.mcell .dn small{font-size:10px;color:var(--bad);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcell.sun .dn,.mcell.hol .dn{color:var(--bad)} .mcell.sat .dn{color:var(--c-blue)}
.mcell.is-today{background:var(--today)}
.mcell .more{font-size:11px;color:var(--ink-3);padding-left:4px}

/* mobile agenda */
.m-sched{display:none}
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:12px}
.daystrip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink-3)}
.daystrip button b{font-family:var(--f-display);font-size:18px;color:var(--ink);line-height:1.2}
.daystrip button.sun b,.daystrip button.hol b{color:var(--bad)} .daystrip button.sat b{color:var(--c-blue)}
.daystrip button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daystrip button[aria-pressed="true"] b{color:var(--accent-ink)}
.daystrip .dots{display:flex;gap:2px;height:5px}
.daystrip .dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}
.m-list{display:flex;flex-direction:column;gap:8px}
.m-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;width:100%}
.m-item .tm{font-weight:700;font-size:12px;color:var(--ink-2);white-space:nowrap;min-width:52px}
.m-item .ttl{font-weight:500;overflow-wrap:anywhere}
.m-item .who{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--ink-3);align-items:center}

/* ---------- trips ---------- */
.trip-table{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tr{display:grid;grid-template-columns:72px minmax(0,1.6fr) minmax(0,1.3fr) minmax(0,1fr) 120px minmax(0,1.2fr);gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.tr:last-child{border-bottom:0}
.tr.head{font-size:12px;color:var(--ink-3);font-weight:700;background:var(--surface-2);letter-spacing:.04em}
button.tr:hover{background:var(--accent-soft)}
.tr .no{color:var(--ink-3);font-size:12px}
.tr .dest b{display:block}
.tr .dest small{color:var(--ink-3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .person{display:flex;align-items:center;gap:8px;min-width:0}
.tr .step{font-size:12px;color:var(--ink-2)}
.tr .lbl{display:none}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,16,24,.46);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;animation:fade .14s ease}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;animation:pop .16s ease}
.modal.wide{width:min(1080px,100%)}
.modal>header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal>header h2{font-size:18px;font-weight:900}
.modal>header .icon-btn{margin-left:auto}
.modal .mbody{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal>footer{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal>footer .spacer{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.field>.lab{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.field .req{color:var(--hanko);margin-left:3px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.timebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timebox select{width:auto;min-width:96px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice label{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label>span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;cursor:pointer;user-select:none}
.choice label>span:hover{border-color:var(--ink-3)}
.choice input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.choice.cats input:checked+span{background:color-mix(in srgb,var(--cat) 16%,var(--surface));border-color:var(--cat);color:var(--ink)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.note{font-size:12px;color:var(--ink-3)}
.alert-box{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.alert-box.warn{background:var(--warn-soft);color:var(--warn)}
.alert-box.bad{background:var(--bad-soft);color:var(--bad)}
.alert-box.info{background:var(--accent-soft);color:var(--accent)}
.alert-box svg{margin-top:1px}

/* trip form + preview document */
.tf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:0;min-height:0;flex:1;overflow:hidden}
.tf .form-col{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.tf .prev-col{background:var(--surface-2);padding:18px;overflow:auto;border-left:1px solid var(--line)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 22px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:13px}
.sheet .sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet h3{font-size:19px;font-weight:900;letter-spacing:.2em}
.sheet .sh-no{font-size:11px;color:var(--ink-3);text-align:right;line-height:1.5}
.stamps{display:flex;border:1px solid var(--ink-2);margin:14px 0 14px auto;width:max-content;max-width:100%}
.stamp{width:72px;border-left:1px solid var(--ink-2);display:flex;flex-direction:column}
.stamp:first-child{border-left:0}
.stamp .role{font-size:10px;text-align:center;border-bottom:1px solid var(--ink-2);padding:2px 0;color:var(--ink-2);letter-spacing:.1em}
.stamp .box{height:66px;display:grid;place-items:center}
.hanko{width:50px;height:50px;border-radius:50%;border:2px solid var(--hanko);color:var(--hanko);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:900;line-height:1.05;transform:rotate(-8deg);background:color-mix(in srgb,var(--hanko) 6%,transparent)}
.hanko b{font-size:13px;letter-spacing:.04em}
.hanko small{font-size:8px;border-top:1px solid var(--hanko);padding-top:1px;margin-top:2px;font-weight:700}
.hanko.ng{border-style:double;border-width:3px}
.stamp .wait{font-size:10px;color:var(--ink-3)}
.sheet dl{display:grid;grid-template-columns:96px minmax(0,1fr);margin:0;border-top:1px solid var(--line-2)}
.sheet dt,.sheet dd{padding:7px 8px;border-bottom:1px solid var(--line-2);margin:0}
.sheet dt{background:var(--surface-2);font-size:12px;color:var(--ink-2);font-weight:700}
.sheet dd{overflow-wrap:anywhere;white-space:pre-wrap}
.sheet dd.ph{color:var(--ink-3)}
.sheet .foot{font-size:11px;color:var(--ink-3);margin-top:10px}
.yen{position:relative}
.yen input{padding-left:26px}
.yen::before{content:"¥";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}

/* trip detail */
.td{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flow li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;position:relative;padding-bottom:16px}
.flow li::after{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line)}
.flow li:last-child::after{display:none}
.flow .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--surface);color:var(--ink-3);font-size:12px;font-weight:700}
.flow li.done .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.flow li.cur .mk{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.flow li.ng .mk{background:var(--bad);border-color:var(--bad);color:#fff}
.flow .who{font-weight:700}
.flow .meta{font-size:12px;color:var(--ink-3)}
.flow .cmt{font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 10px;margin-top:4px;white-space:pre-wrap}
.act-box{background:var(--warn-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.act-box h3{font-size:14px;color:var(--warn)}
.act-box .btns{display:flex;gap:8px;flex-wrap:wrap}

/* settings */
.set-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.mem-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1.4fr) 36px;gap:8px;align-items:center;padding:6px 0}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.who-grid button{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.who-grid button:hover{border-color:var(--accent);background:var(--accent-soft)}

.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:80;box-shadow:var(--shadow);animation:pop .16s ease;max-width:calc(100% - 32px)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--ink-3);text-align:center;gap:6px}
.skel{height:14px;border-radius:7px;background:var(--surface-2);margin:10px 0}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .grid-home{grid-template-columns:minmax(0,1fr)}
  .td{grid-template-columns:minmax(0,1fr)}
  .td>:last-child{order:-1}
  .tf{grid-template-columns:minmax(0,1fr);overflow:auto}
  .tf .form-col,.tf .prev-col{overflow:visible}
  .tf .prev-col{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-block:16px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--ink-3);padding:6px 0;position:relative}
  .tabbar button svg.i{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0;height:17px;min-width:17px;font-size:10px}
  .fab{display:grid;place-items:center;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);z-index:41}
  .fab svg.i{width:26px;height:26px}
  .page-head{margin-bottom:14px}
  .page-head h1{font-size:22px}
  .page-head .sub{display:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .page-head .actions .btn.primary{display:none}
  .hello h1{font-size:22px}
  .stats{gap:8px}
  .stat{padding:10px 12px}
  .stat .v{font-size:22px}
  .d-sched{display:none}
  .m-sched{display:block}
  .tr.head{display:none}
  .tr{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:14px 16px}
  .tr .no{order:5;grid-column:1/-1}
  .tr .dest{grid-column:1/2;order:1}
  .tr .stt{order:2;justify-self:end}
  .tr .when{order:3;grid-column:1/-1;font-size:13px;color:var(--ink-2)}
  .tr .person{order:4;grid-column:1/-1}
  .tr .step{order:6;grid-column:1/-1}
  .set-grid{grid-template-columns:minmax(0,1fr)}
  .scrim{padding:0;align-items:flex-end}
  .modal,.modal.wide{width:100%;max-height:calc(100% - 24px);border-radius:16px 16px 0 0}
  .modal>footer{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .row3{grid-template-columns:minmax(0,1fr)}
  .toolbar .range{font-size:16px;width:100%;order:-1}
}
@media (max-width:460px){
  .row2{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat .k{font-size:11px}
}
/* ================= 上質な仕上げ（トークンと部品の上書き） ================= */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F1F3F6; --line:#E5E8ED; --line-2:#D4D9E0;
  --ink:#0E1726; --ink-2:#4A5466; --ink-3:#8993A2;
  --accent:#2448A6; --accent-ink:#FFFFFF; --accent-soft:#EDF1FB; --accent-strong:#1A3683;
  --side:#0A1322; --side-2:#13223A; --side-ink:#E6ECF4; --side-ink-2:#8193AB; --side-hi:rgba(255,255,255,.07);
  --today:#F3F6FD; --weekend:#FAFBFC; --hol:#FDF4F3;
  --shadow:0 1px 2px rgba(14,23,38,.05),0 18px 40px -12px rgba(14,23,38,.16);
  --shadow-sm:0 1px 2px rgba(14,23,38,.04),0 4px 14px -6px rgba(14,23,38,.08);
  --f-body:"Inter","Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"Inter","Noto Sans JP",sans-serif;
  --r:16px;
}
@media not all{:root:not([data-theme="light"]){
  --bg:#0A0E14; --surface:#111720; --surface-2:#171F2A; --line:#212A36; --line-2:#2D3846;
  --ink:#E9EEF4; --ink-2:#A3AEBC; --ink-3:#6E7A89;
  --accent:#8DADF4; --accent-ink:#0A1120; --accent-soft:#17223A; --accent-strong:#B6CAF9;
  --side:#060A10; --side-2:#0E1828; --side-hi:rgba(255,255,255,.06);
  --today:#141D2C; --weekend:#0D1219; --hol:#1E1416;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 4px 14px -6px rgba(0,0,0,.4);
}}
:root[data-theme="dark-disabled"]{
  --bg:#0A0E14; --surface:#111720; --surface-2:#171F2A; --line:#212A36; --line-2:#2D3846;
  --ink:#E9EEF4; --ink-2:#A3AEBC; --ink-3:#6E7A89;
  --accent:#8DADF4; --accent-ink:#0A1120; --accent-soft:#17223A; --accent-strong:#B6CAF9;
  --side:#060A10; --side-2:#0E1828; --side-hi:rgba(255,255,255,.06);
  --today:#141D2C; --weekend:#0D1219; --hol:#1E1416;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 4px 14px -6px rgba(0,0,0,.4);
}
body{font-feature-settings:"palt" 1;letter-spacing:.01em}
.num,.stat .v,.week .h .d,.mcell .dn,.daystrip button b,.agenda .tm,.m-item .tm,.chip .t{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{letter-spacing:.02em}
.page-head h1,.hello h1{font-weight:700;font-size:30px;letter-spacing:.03em}
.page-head .sub{font-size:13px;margin-top:4px}
.main{padding-block:36px 64px;padding-left:max(40px, env(safe-area-inset-left,0px));padding-right:max(40px, env(safe-area-inset-right,0px));max-width:1480px}

/* サイドバー */
.side{background:linear-gradient(180deg,var(--side-2) 0%,var(--side) 46%);padding:26px 16px;border-right:1px solid rgba(255,255,255,.04)}
.brand{padding:2px 8px 28px}
.brand-mark{background:linear-gradient(145deg,#FFFFFF,#C9D5E6);color:#0A1322;border-radius:10px;box-shadow:0 6px 16px -6px rgba(0,0,0,.6)}
.brand b{font-weight:700;letter-spacing:.06em}
.brand small{font-family:var(--f-num);font-weight:500;letter-spacing:.18em;font-size:10px}
.nav{gap:4px}
.nav button{padding:11px 14px;border-radius:10px;font-size:14px;letter-spacing:.04em;transition:background .15s,color .15s}
.nav button[aria-current="page"]{background:var(--side-hi);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.nav button[aria-current="page"] svg.i{color:#9DB8F5}
.whoami{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px}
.badge{background:#D8463A;font-family:var(--f-num);box-shadow:0 0 0 2px var(--side)}

/* ボタン・入力 */
.btn{height:40px;border-radius:10px;border-color:var(--line);box-shadow:var(--shadow-sm);font-weight:500;letter-spacing:.04em;transition:border-color .15s,background .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));border-color:var(--accent);box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 8px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.ghost{box-shadow:none}
.btn.sm{height:34px}
.icon-btn{border-radius:10px;border-color:var(--line);box-shadow:var(--shadow-sm)}
select.sel,input.inp,textarea.inp{height:42px;border-radius:10px;border-color:var(--line-2);background:var(--surface)}
.seg{border-radius:12px;padding:4px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border-radius:9px;padding:7px 16px;letter-spacing:.04em}
.seg button[aria-pressed="true"]{box-shadow:var(--shadow-sm)}
.choice label>span{height:34px;border-radius:17px;border-color:var(--line-2);letter-spacing:.03em}

/* パネル・ホーム */
.panel{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.panel>header{padding:18px 22px 6px;border-bottom:0}
.panel>header h2{font-size:15px;font-weight:700;letter-spacing:.06em}
.panel .body{padding:6px 22px 18px}
.grid-home{gap:22px}
.hello{margin-bottom:26px;gap:16px}
.hello .date{font-family:var(--f-num);font-size:14px;color:var(--ink-3);letter-spacing:.04em}
.stats{gap:16px;margin-bottom:22px}
.stat{border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow-sm);gap:6px;transition:border-color .15s,box-shadow .15s}
button.stat:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.stat .k{font-size:12px;letter-spacing:.1em}
.stat .v{font-size:36px;font-weight:600;line-height:1.05}
.stat .v small{font-family:var(--f-body);font-size:13px}
.stat.alert{background:linear-gradient(135deg,color-mix(in srgb,var(--hanko) 7%,var(--surface)),var(--surface) 60%);border-color:color-mix(in srgb,var(--hanko) 25%,var(--line))}
.agenda li{border-bottom:1px solid var(--line);padding:13px 0}
.trip-mini{border-bottom:1px solid var(--line);padding:14px 0}
.pill{height:24px;padding:0 10px;font-size:11.5px;letter-spacing:.06em;font-weight:600}

/* カレンダー */
.cal-wrap,.trip-table{border-radius:var(--r);box-shadow:var(--shadow-sm)}
.week .h{padding:14px 12px 10px;background:var(--surface)}
.week .h .d{font-size:22px;font-weight:600}
.week .h .w{font-size:12px}
.week .h.is-today{background:var(--today)}
.week .h.is-today .d{background:var(--accent);box-shadow:0 6px 14px -6px var(--accent)}
.rowhead{padding:12px}
.cell{padding:7px 7px 28px}
.chip{border-radius:8px;padding:5px 8px 5px 11px;background:color-mix(in srgb,var(--cat) 10%,var(--surface))}
.chip::before{top:5px;bottom:5px;width:3px;left:3px}
.chip:hover{background:color-mix(in srgb,var(--cat) 18%,var(--surface))}
.tr{padding:15px 22px}
.tr.head{background:var(--surface-2);font-size:11px;letter-spacing:.12em}

/* モーダル */
.scrim{background:rgba(6,11,20,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal{border-radius:20px;border:1px solid var(--line)}
.modal>header{padding:20px 24px;border-bottom-color:var(--line)}
.modal>header h2{font-weight:700;letter-spacing:.04em}
.modal .mbody{padding:22px 24px}
.modal>footer{padding:16px 24px;background:var(--surface-2);border-radius:0 0 20px 20px}
.sheet{border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -12px rgba(0,0,0,.18)}
.sheet h3{font-weight:700;letter-spacing:.32em}

/* スマホ */
@media (max-width:820px){
  .main{padding-block:20px calc(100px + env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .page-head h1,.hello h1{font-size:22px}
  .tabbar{background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--line)}
  .tabbar button{font-size:10px;letter-spacing:.06em}
  .fab{border-radius:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));box-shadow:0 12px 28px -10px color-mix(in srgb,var(--accent) 80%,transparent)}
  .stat{padding:12px 14px}
  .stat .v{font-size:26px}
  .modal,.modal.wide{border-radius:20px 20px 0 0}
  .modal>footer{border-radius:0}
}

[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
.chip.busy{--cat:var(--ink-3);background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px);color:var(--ink-2);cursor:default}
.chip.busy::before{background:var(--line-2)}
.lk{display:inline-flex;vertical-align:-2px;margin-right:3px;color:var(--ink-3)}
.lk svg.i{width:12px;height:12px;stroke-width:2.2}
.check svg.i{width:14px;height:14px;color:var(--ink-3)}
/* login */
:root{padding-top:env(safe-area-inset-top,0px)}
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));background:radial-gradient(1200px 600px at 50% -10%, var(--accent-soft), transparent 70%), var(--bg)}
.login-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:var(--shadow);text-align:center}
.login-card h1{font-size:24px;font-weight:900;margin-top:14px}
.brand-mark.big{width:56px;height:56px;border-radius:14px;font-size:18px;margin:0 auto;background:var(--side);color:#fff}
/* ================= パステル配色（ネイビーをやめて明るく華やかに） ================= */
:root{
  --bg:#FAF7FF; --surface:#FFFFFF; --surface-2:#F5F1FC; --line:#EDE7F6; --line-2:#DCD3EC;
  --ink:#2B2541; --ink-2:#5F5878; --ink-3:#9A93AF;
  --accent:#7C6BF2; --accent-ink:#FFFFFF; --accent-soft:#F0ECFF; --accent-strong:#6553E0;
  --side:#F3EEFF; --side-2:#E6F7F2; --side-ink:#2B2541; --side-ink-2:#6E6789; --side-hi:#FFFFFF;
  --today:#FFF8DD; --weekend:#FCFAFF; --hol:#FFF1F5;
  --grad-main:linear-gradient(135deg,#8E7CFF 0%,#FF8FB8 100%);
  --shadow:0 1px 2px rgba(80,60,140,.06),0 18px 40px -14px rgba(110,80,200,.24);
  --shadow-sm:0 1px 2px rgba(80,60,140,.05),0 6px 16px -8px rgba(110,80,200,.16);
}
body{background:radial-gradient(900px 520px at 105% -10%,#FFE6F1 0%,transparent 60%),radial-gradient(820px 520px at -10% 110%,#DDF6EF 0%,transparent 60%),var(--bg);background-attachment:fixed}
/* サイドバー：ミント → ラベンダー → ピンク */
.side{background:linear-gradient(180deg,#E3F6F0 0%,#EFEAFF 52%,#FFEDF4 100%);border-right:1px solid var(--line)}
.brand-mark{background:url(favicon-64.png) center/cover no-repeat;color:transparent;box-shadow:0 6px 14px -6px rgba(15,181,154,.55)}
.brand b{color:var(--side-ink)}
.brand small{color:var(--side-ink-2)}
.nav button{color:var(--side-ink-2)}
.nav button:hover{color:var(--side-ink);background:rgba(255,255,255,.6)}
.nav button[aria-current="page"]{background:#fff;color:var(--accent-strong);box-shadow:var(--shadow-sm)}
.nav button[aria-current="page"] svg.i{color:var(--accent)}
.whoami{background:rgba(255,255,255,.75);border:1px solid var(--line);color:var(--side-ink)}
.whoami small,.mode-note{color:var(--side-ink-2)}
.badge{background:#FF6B9A;box-shadow:0 0 0 2px #fff}
/* ボタン・強調 */
.btn.primary,.fab{background:var(--grad-main);border-color:transparent;color:#fff;box-shadow:0 10px 20px -10px rgba(170,110,240,.7)}
.btn.primary:hover{background:linear-gradient(135deg,#7C6BF2 0%,#FF7AAA 100%);border-color:transparent}
.week .h.is-today .d{background:var(--grad-main);color:#fff;box-shadow:0 6px 14px -6px rgba(255,120,170,.7)}
.daystrip button[aria-pressed="true"]{background:var(--grad-main);border-color:transparent}
.seg button[aria-pressed="true"]{color:var(--accent-strong)}
/* ホームの数字カードを色分け */
.stats .stat:nth-child(1){background:linear-gradient(135deg,#FFEFF6 0%,#FFFFFF 75%);border-color:#FBDDEA}
.stats .stat:nth-child(2){background:linear-gradient(135deg,#EFEBFF 0%,#FFFFFF 75%);border-color:#E2DBFB}
.stats .stat:nth-child(3){background:linear-gradient(135deg,#E5F8F2 0%,#FFFFFF 75%);border-color:#CFEFE5}
.stats .stat:nth-child(1) .v{color:#E2558A}
.stats .stat:nth-child(2) .v{color:#6E5AE6}
.stats .stat:nth-child(3) .v{color:#16A389}
.panel{border-color:var(--line)}
.hello h1{background:linear-gradient(90deg,#6E5AE6,#E2558A);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 会社カレンダーの行はミント */
.band{background:color-mix(in srgb,#2EC4A6 9%,#FFFFFF)}
.rowhead.band .nm{color:#13A388}
/* ログイン・合言葉の画面 */
.login{background:radial-gradient(700px 420px at 15% 0%,#E3F6F0 0%,transparent 65%),radial-gradient(700px 420px at 90% 10%,#FFE6F1 0%,transparent 65%),radial-gradient(800px 500px at 50% 110%,#EFEAFF 0%,transparent 65%),var(--bg)}
.brand-mark.big{background:url(icon-192.png) center/cover no-repeat;color:transparent;width:72px;height:72px;border-radius:18px;box-shadow:0 12px 26px -12px rgba(15,181,154,.6)}
.login-card h1{color:var(--ink)}
</style>

<script>
(() => {
"use strict";
/* ============ 定数 ============ */
const CATS = [
  {k:"商談",c:"red"},{k:"打合",c:"red"},{k:"納品",c:"red"},
  {k:"出張",c:"orange"},{k:"会合",c:"orange"},{k:"イベント",c:"orange"},{k:"展示会",c:"orange"},
  {k:"会議",c:"brown"},{k:"リモート会議",c:"purple"},

  {k:"個人休み",c:"blue"},{k:"本社休み",c:"blue"},{k:"店舗定休日",c:"blue"},
  {k:"バースデー",c:"pink"},{k:"その他",c:"gray"}

const CAT_COLOR = Object.fromEntries(CATS.map(c => [c.k, c.c]));
const FACILITIES = [
  {id:"f1",name:"鉄板ミュージアム",g:"部屋"},
  {id:"f2",name:"本社会議室A（TV有）",g:"部屋"},

];
const LODGING = ["無し","有り（ホテル）","有り（その他）"];
const TRANSPORT = ["社用車","自家用車","新幹線","飛行機","バス","船","その他"];
const ARRANGE = ["自己手配","会社手配","その他"];
const HOLIDAYS = {
  "2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日","2026-02-23":"天皇誕生日","2026-03-20":"春分の日",
  "2026-04-29":"昭和の日","2026-05-03":"憲法記念日","2026-05-04":"みどりの日","2026-05-05":"こどもの日","2026-05-06":"振替休日",
  "2026-07-20":"海の日","2026-08-11":"山の日","2026-09-21":"敬老の日","2026-09-22":"国民の休日","2026-09-23":"秋分の日",
  "2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日",
  "2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日","2027-02-23":"天皇誕生日","2027-03-21":"春分の日",
  "2027-03-22":"振替休日","2027-04-29":"昭和の日","2027-05-03":"憲法記念日","2027-05-04":"みどりの日","2027-05-05":"こどもの日",
  "2027-07-19":"海の日","2027-08-11":"山の日","2027-09-20":"敬老の日","2027-09-23":"秋分の日","2027-10-11":"スポーツの日",
  "2027-11-03":"文化の日","2027-11-23":"勤労感謝の日"
};
const AV_COLORS = ["#1D4E89","#B5532A","#2E7D5B","#7A4FB0","#B0373E","#2A7F98","#8A6A1F","#5B6B7E","#A2457A","#3D6B2C","#C2703A","#4F5FB8"];
const LOCAL_SEED = {
  members:{
    m08:{name:"森田 淳平",order:1},
    m01:{name:"村竹 真一",order:2}, m02:{name:"山本 博",order:3},
    m05:{name:"川本 裕介",order:4}, m04:{name:"小柳 徹郎",order:5},
    m03:{name:"満居 哲雄",order:6}, m07:{name:"小早川 健",order:7},
    m06:{name:"高木 将晃",order:8}, m09:{name:"諸岡 律子",order:9},
    m10:{name:"村竹 睦子",order:10}, m11:{name:"村竹 美奈",order:11,color:"#E07A97"}
  },
  events:{}, trips:{},
  config:{route:{managerId:"m02",presidentId:"m01",accountingId:""}}
};

/* ============ ユーティリティ ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const WD = "日月火水木金土";
const md = s => { if(!s) return ""; const d = fromYmd(s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };
const mdShort = s => { if(!s) return ""; const d = fromYmd(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const todayStr = () => ymd(new Date());
const nowIso = () => new Date().toISOString();
const fmtAt = iso => { if(!iso) return ""; const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const yen = n => "¥" + (Number(n)||0).toLocaleString("ja-JP");
const TIMES = (() => { const a=[]; for(let h=6;h<24;h++) for(let m=0;m<60;m+=15) a.push(`${pad(h)}:${pad(m)}`); return a; })();
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const ICON = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  plane:'<path d="M10.5 13.5 3 11l1.5-1.5 8 1 4-4.5a2.1 2.1 0 0 1 3 3l-4.5 4 1 8L14.5 22 12 14.5"/><path d="M6 17l-2 3"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  check:'<path d="m5 12 5 5L20 7"/>',
  warn:'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
const ic = (n, cls="") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ============ 状態 ============ */
const S = {
  mode:"init", members:[], events:[], trips:[],
  route:{managerId:"",presidentId:"",accountingId:""},
  meId:null, viewerId:null, loadedCols:new Set(), slow:false,
  view: (ls.get("k2s-view") || "home"),
  anchor: new Date(), schedMode: (ls.get("k2s-smode") || "week"), filter: (ls.get("k2s-filter") || "all"),
  mDay: todayStr(), tripTab: "inbox", modal:null
};
let DB = null, USER = null, LOCAL = null;

/* ============ データ層（Firebase / お試しモード） ============ */
const FB_CFG = window.FIREBASE_CONFIG || {};
const FB_CONFIGURED = !!(FB_CFG.apiKey && !/ここに|YOUR_/.test(FB_CFG.apiKey));
const FB_READY = FB_CONFIGURED && !!window.firebase;
let AUTH = null;
async function initStore(){
  if(FB_CONFIGURED && !FB_READY){
    $("#root").innerHTML = `<div class="login"><div class="login-card"><div class="brand-mark big">K2S</div><h1>接続できません</h1><p class="note">インターネットにつながっていないため、アプリを起動できませんでした。電波のよい場所で、もう一度開いてください。</p><button class="btn primary" onclick="location.reload()" style="margin-top:12px">再読み込み</button></div></div>`;
    return;
  }
  if(FB_READY){
    firebase.initializeApp(FB_CFG);
    AUTH = firebase.auth();
    DB = firebase.firestore();
    try { await DB.enablePersistence({synchronizeTabs:true}); } catch(e){}
    S.mode = "auth";
    render();
    AUTH.onAuthStateChanged(u => {
      if(!u){ if(S.viewerId){ location.reload(); return; } S.mode = "auth"; S.authUser = null; render(); return; }
      S.authUser = u; S.viewerId = u.uid; S.mode = "db";
      startSync();
    });
    return;
  }
  S.mode = "local";
  LOCAL = ls.get("k2s-local-v1") || clone(LOCAL_SEED);
  S.meId = ls.get("k2s-me");
  applyLocal();
  render();
}
function startSync(){
  {
    const slowTimer = setTimeout(() => { if(S.loadedCols.size < 3){ S.slow = true; render(); } }, 10000);
    const subCol = (col, key) => DB.collection(col).onSnapshot({includeMetadataChanges: true}, snap => {
      S[key || col] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      if(key === "sharedEvents") mergeEvents();
      if(col === "members"){ resolveMe(); migrateEmails(); }
      if(!snap.metadata.fromCache){ S.loadedCols.add(col); if(S.loadedCols.size >= 3){ clearTimeout(slowTimer); S.slow = false; } }
      render();
    }, err => {
      if(err && err.code === "permission-denied"){ S.denied = true; clearTimeout(slowTimer); render(); return; }
      S.slow = true; S.loadedCols.add(col); render();
    });
    subCol("members"); subCol("events", "sharedEvents"); subCol("trips");
    // 自分だけの予定（本人以外は読めない場所に保存）
    DB.collection(privPath()).onSnapshot(snap => {
      S.privEvents = snap.docs.map(d => ({id:d.id, ...d.data(), private:true})); mergeEvents(); render();
    }, () => {});
    DB.doc("config/route").onSnapshot(d => { S.route = d.exists ? {...S.route, ...d.data()} : S.route; render(); }, () => {});
    // 自分の名簿（allow/自分のアドレス）：本人も読める
    DB.doc("allow/" + myEmail()).onSnapshot(d => {
      S.myMemberId = d.exists ? d.data().memberId : null; S.linkLoaded = true; resolveMe(); render();
    }, () => { S.linkLoaded = true; render(); });
    // 名簿全体：読めるのは管理者だけ（読めたら管理者と判断）
    DB.collection("allow").onSnapshot(snap => {
      S.isAdmin = true; S.allowMap = {};
      snap.docs.forEach(d => { const v = d.data(); if(v && v.memberId) S.allowMap[v.memberId] = d.id; });
      render(); migrateEmails();
    }, () => { S.isAdmin = false; S.allowMap = {}; render(); });
  }
  render();
}
async function doLogin(){
  const email = $("#lgEmail").value.trim(), pw = $("#lgPw").value, err = $("#lgErr");
  if(!email || !pw){ err.hidden = false; err.textContent = "メールアドレスとパスワードを入力してください。"; return; }
  const btn = $("#lgBtn"); btn.disabled = true; btn.textContent = "ログイン中…";
  try { await AUTH.signInWithEmailAndPassword(email, pw); }
  catch(e){
    err.hidden = false;
    err.textContent = ["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].includes(e.code)
      ? "メールアドレスかパスワードが違います。" : e.code === "auth/too-many-requests" ? "何度も失敗したため一時的にロックされています。しばらく待ってからお試しください。" : "ログインできませんでした。通信状況を確認してください。";
    btn.disabled = false; btn.textContent = "ログイン";
  }
}
async function doReset(){
  const email = $("#lgEmail").value.trim(), err = $("#lgErr");
  if(!email){ err.hidden = false; err.textContent = "パスワードを再設定するメールアドレスを入力してください。"; $("#lgEmail").focus(); return; }
  try { await AUTH.sendPasswordResetEmail(email); toast("パスワード再設定のメールを送りました"); }
  catch(e){ err.hidden = false; err.textContent = "メールを送れませんでした。アドレスを確認してください。"; }
}
async function doSignup(){
  const email = $("#lgEmail").value.trim(), pw = $("#lgPw").value, pw2 = ($("#lgPw2") || {}).value, err = $("#lgErr");
  const fail = m => { err.hidden = false; err.textContent = m; };
  if(!email || !pw) return fail("メールアドレスと、決めたパスワードを入力してください。");
  if(pw.length < 8) return fail("パスワードは8文字以上にしてください。");
  if(pw !== pw2) return fail("確認用のパスワードが一致しません。");
  const btn = $("#lgBtn"); btn.disabled = true; btn.textContent = "登録中…";
  try { await AUTH.createUserWithEmailAndPassword(email, pw); S.signup = false; }
  catch(e){
    fail(e.code === "auth/email-already-in-use" ? "このメールアドレスはすでに登録済みです。「ログイン」から入ってください（パスワードを忘れた場合は再設定できます）。"
      : e.code === "auth/invalid-email" ? "メールアドレスの形が正しくありません。"
      : e.code === "auth/weak-password" ? "パスワードが簡単すぎます。8文字以上で、英字と数字を混ぜてください。" : "登録できませんでした。通信状況を確認してください。");
    btn.disabled = false; btn.textContent = "パスワードを決めて始める";
  }
}
function viewLogin(){
  const su = !!S.signup;
  return `<div class="login">
    <div class="login-card">
      <div class="brand-mark big">K2S</div>
      <h1>ワークボード</h1>
      <p class="note" style="margin:0 0 18px">${su ? "はじめての方：自分のパスワードを決めます" : "スケジュールと出張申請"}</p>
      <form id="loginForm" novalidate style="display:flex;flex-direction:column;gap:12px;text-align:left">
        <label class="field"><span>メールアドレス</span><input class="inp" id="lgEmail" type="email" autocomplete="username" inputmode="email" placeholder="name@k-2-s.jp"></label>
        <label class="field"><span>${su ? "決めるパスワード（8文字以上）" : "パスワード"}</span><input class="inp" id="lgPw" type="password" autocomplete="${su ? "new-password" : "current-password"}"></label>
        ${su ? `<label class="field"><span>パスワード（確認のためもう一度）</span><input class="inp" id="lgPw2" type="password" autocomplete="new-password"></label>` : ""}
        <p id="lgErr" class="alert-box bad" hidden></p>
        <button class="btn primary" id="lgBtn" type="submit" style="justify-content:center;height:44px">${su ? "パスワードを決めて始める" : "ログイン"}</button>
        ${su ? "" : `<button class="btn ghost sm" type="button" data-act="pw-reset" style="justify-content:center">パスワードを忘れた</button>`}
      </form>

function applyLocal(){

  S.sharedEvents = Object.entries(LOCAL.events || {}).map(([id, v]) => ({id, ...v}));

async function put(col, id, obj){
  const body = JSON.parse(JSON.stringify(obj)); delete body.id;
  if(S.mode === "db"){
    try { await colRef(col).doc(id).set(body); }
    catch(e){ toast(writeErr(e)); throw e; }
  } else {
    LOCAL[col] = LOCAL[col] || {}; LOCAL[col][id] = body; ls.set("k2s-local-v1", LOCAL); applyLocal(); render();
  }
}
async function del(col, id){

  }
}

// 社員のメールアドレスを設定。共有モードではアドレスは allow（管理者と本人だけが読める）にだけ保存し、社員一覧には残さない
async function setMemberEmail(id, email){
  const m = mem(id); if(!m) return;
  email = (email || "").trim().toLowerCase();
  if(S.mode !== "db"){
    if(email && S.members.some(x => x.id !== id && (x.email || "").toLowerCase() === email)){ toast("そのメールアドレスは別の社員に登録されています"); throw new Error("dup"); }
    const body = {...m, email}; delete body.id; delete body.title;
    await put("members", id, body); return;
  }
  const old = (emailOf(id) || m.email || "").toLowerCase();
  if(email && Object.entries(S.allowMap || {}).some(([mid, e]) => mid !== id && e === email)){ toast("そのメールアドレスは別の社員に登録されています"); throw new Error("dup"); }
  if(old && old !== email) await del("allow", old);
  if(email) await put("allow", email, {memberId:id});
  if("email" in m){ const body = {...m}; delete body.id; delete body.title; delete body.email; await put("members", id, body); }
}
// 以前の形式（社員一覧にアドレスが入っていた）を、管理者が開いたときに一度だけ移し替える
let migrating = false;
async function migrateEmails(){
  if(migrating || S.mode !== "db" || !S.isAdmin) return;
  const olds = S.members.filter(m => m.email);
  if(!olds.length) return;
  migrating = true;
  try {
    for(const m of olds){
      const e = m.email.toLowerCase();
      if(!S.allowMap || S.allowMap[m.id] !== e) await put("allow", e, {memberId:m.id});
      const body = {...m}; delete body.id; delete body.title; delete body.email;
      await put("members", m.id, body);
    }
  } catch(e){}
  migrating = false;
}

// サイボウズから抜き出した予定（cybozu-import.json）を一括登録。IDが固定なので何度実行しても重複しない
async function importCybozu(btn){
  let list;
  try { list = await (await fetch("cybozu-import.json", {cache:"no-store"})).json(); }
  catch(e){ toast("取り込みデータ（cybozu-import.json）が見つかりません"); return; }
  if(!(await confirmBox(`サイボウズの予定 ${list.length}件を取り込みます。すでに取り込んだ予定は上書きされるだけで、重複はしません。`, "取り込む"))) return;
  btn.disabled = true;
  const now = nowIso();
  try {
    if(S.mode === "db"){
      for(let i = 0; i < list.length; i += 400){
        const b = DB.batch();
        for(const e of list.slice(i, i + 400)){ const {id, ...rest} = e; b.set(DB.collection("events").doc(id), {...rest, createdAt:now, createdBy:S.meId || "", updatedAt:now}); }
        await b.commit();
        btn.textContent = `取り込み中… ${Math.min(i + 400, list.length)} / ${list.length}`;
      }
    } else {
      LOCAL.events = LOCAL.events || {};
      for(const e of list){ const {id, ...rest} = e; LOCAL.events[id] = {...rest, createdAt:now}; }
      ls.set("k2s-local-v1", LOCAL); applyLocal(); render();
    }
    btn.textContent = "取り込み済み";
    toast(`サイボウズの予定 ${list.length}件を取り込みました`);
  } catch(e){ btn.disabled = false; btn.textContent = "取り込む"; toast(writeErr(e)); }
}
function writeErr(e){
  const c = e && e.code;
  if(c === "permission-denied") return "保存する権限がありません。ログインし直してください。";
  if(c === "resource-exhausted") return "保存の上限に達しました。管理者に連絡してください。";
  return "保存できませんでした。通信状況を確認して、もう一度お試しください。";
}

const timeLabel = e => e.allDay || !e.start ? "終日" : `${e.start}${e.end ? "–"+e.end : ""}`;
function clashSet(){
  const out = new Set();
  const evs = S.events.filter(e => (e.facilityIds||[]).length);
  for(let i=0;i<evs.length;i++) for(let j=i+1;j<evs.length;j++){
    const a = evs[i], b = evs[j];
    if(!(a.facilityIds||[]).some(f => (b.facilityIds||[]).includes(f))) continue;
    if(overlaps(a, b)){ out.add(a.id); out.add(b.id); }
  }
  return out;
}
function overlaps(a, b){
  if(!(a.date <= (b.endDate||b.date) && (a.endDate||a.date) >= b.date)) return false;
  if(a.allDay || b.allDay || !a.start || !b.start) return true;
  return a.start < (b.end || "24:00") && b.start < (a.end || "24:00");
}

/* 出張の状態 */
function tripState(t){
  if(t.status === "withdrawn") return {k:"withdrawn", label:"取り下げ"};
  if(t.status === "rejected") return {k:"rejected", label:"却下"};
  if(t.status === "returned") return {k:"returned", label:"差し戻し"};
  const steps = t.steps || [];
  const cur = steps.findIndex(s => !s.result);
  if(cur < 0) return {k:"done", label:"完了"};
  if(steps.some(s => s.kind === "決裁" && s.result)) return {k:"decided", label:"決裁済", cur};
  return {k:"pending", label:"承認待ち", cur};
}
const pill = t => { const s = tripState(t); return `<span class="pill st-${s.k}">${s.label}</span>`; };
const myInbox = () => S.trips.filter(t => { const s = tripState(t); return s.cur !== undefined && t.steps[s.cur].memberId === S.meId; }).sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
const nightsLabel = (a, b) => { if(!a || !b) return ""; const n = Math.round((fromYmd(b) - fromYmd(a)) / 864e5); return n <= 0 ? "日帰り" : `${n}泊${n+1}日`; };
const stepLabel = t => {
  const s = tripState(t);
  if(s.cur === undefined) return s.k === "done" ? "すべての処理が完了" : s.k === "returned" ? "申請者が修正中" : "—";
  const st = t.steps[s.cur]; return `${st.role}（${memName(st.memberId)}）の${st.kind}待ち`;
};
function buildSteps(applicantId){
  const r = S.route, out = [];
  if(r.managerId && r.managerId !== applicantId) out.push({kind:"承認", role:"課長", memberId:r.managerId, result:null});
  if(r.presidentId && r.presidentId !== applicantId) out.push({kind:"決裁", role:"社長", memberId:r.presidentId, result:null});
  if(r.accountingId) out.push({kind:"確認", role:"経理", memberId:r.accountingId, result:null});
  return out;
}
function nextTripNo(){
  const y = new Date().getFullYear();
  const n = S.trips.filter(t => String(t.no||"").startsWith(y + "-")).length + 1;
  return `${y}-${String(n).padStart(3,"0")}`;
}

  </div>`;
  const head = `<div class="page-head"><div><h1>スケジュール</h1><div class="sub">空いているマスをクリックすると、その人・その日で予定を登録できます</div></div><div class="actions"><button class="btn primary" data-act="new-event">${ic("plus")}予定を登録</button></div></div>`;

  return head + `<div class="d-sched">${toolbar}<div class="cal-wrap">${grid}</div>${legend}</div>` + mobileSched(days);
}
function filteredMembers(){
  const ms = sortedMembers();
  if(S.filter === "all") { const me = ms.find(m => m.id === S.meId); return me ? [me, ...ms.filter(m => m.id !== S.meId)] : ms; }
  if(S.filter === "me") return ms.filter(m => m.id === S.meId);
  return ms.filter(m => m.id === S.filter);
}
function chip(e, clash, k){
  const multi = e.endDate && e.endDate !== e.date;
  const t = (e.private ? `<span class="lk" title="自分だけの予定">${ic("lock")}</span>` : "") + (e.allDay || !e.start ? "" : `<span class="t">${esc(e.start)}</span>`);
  const extra = [];
  if(multi) extra.push(`${mdShort(e.date)}〜${mdShort(e.endDate)}`);
  if((e.facilityIds||[]).length) extra.push(e.facilityIds.map(f => (fac(f)||{}).name || "").join("、"));
  if(e.busy) return `<button class="chip busy" data-ev="${esc(e.id)}" title="非公開の予定"><span class="lk">${ic("lock")}</span>${e.allDay || !e.start ? "" : `<span class="t">${esc(e.start)}${e.end ? "–" + esc(e.end) : ""}</span>`}予定あり</button>`;
  return `<button class="chip ${e.tripId?"trip":""} ${clash.has(e.id)?"clash":""}" style="${catVar(e.category)}" data-ev="${esc(e.id)}" title="${esc(timeLabel(e) + " " + e.title)}">${t}${esc(e.title)}${extra.length?`<span class="x">${esc(extra.join("・"))}</span>`:""}</button>`;
}
function dayClass(d){
  const k = ymd(d); const c = [];
  if(d.getDay() === 0) c.push("sun"); if(d.getDay() === 6) c.push("sat");
  if(d.getDay() === 0 || d.getDay() === 6) c.push("weekend");
  if(HOLIDAYS[k]) c.push("hol");
  if(k === todayStr()) c.push("is-today");
  return c;
}
function weekGrid(days, byFacility){
  const clash = clashSet();
  const head = `<div class="h">${byFacility ? "施設・社用車" : "メンバー"}</div>` + days.map(d => { const k = ymd(d); return `<div class="h ${dayClass(d).join(" ")}"><span class="d num">${d.getDate()}</span><span class="w">${WD[d.getDay()]}</span>${HOLIDAYS[k]?`<span class="hn">${HOLIDAYS[k]}</span>`:""}</div>`; }).join("");
  const band = `<div class="rowhead band" title="休業日・全社の予定（空いているマスを押すと追加できます）"><div class="nm">会社カレンダー</div></div>` + days.map(d => { const k = ymd(d); const evs = S.events.filter(e => e.allCompany && onDay(e,k)).sort(cmpEv); return `<div class="cell band ${dayClass(d).filter(c=>c!=="sun"&&c!=="sat").join(" ")}" data-add="all|${k}">${evs.map(e => chip(e, clash, k)).join("")}</div>`; }).join("");
  let rows = "";
  if(byFacility){
    for(const f of FACILITIES){
      rows += `<div class="rowhead"><div class="nm">${esc(f.name)}<small>${f.g}</small></div></div>` + days.map(d => { const k = ymd(d); const evs = S.events.filter(e => onDay(e,k) && (e.facilityIds||[]).includes(f.id)).sort(cmpEv); return `<div class="cell ${dayClass(d).filter(c=>c!=="sun"&&c!=="sat").join(" ")}" data-add="fac:${f.id}|${k}">${evs.map(e => chip(e, clash, k)).join("")}<span class="add" aria-hidden="true">${ic("plus")}</span></div>`; }).join("");
    }
  } else {
    for(const m of filteredMembers()){
      const isMe = m.id === S.meId;
      rows += `<div class="rowhead ${isMe?"me":""}">${av(m.id, true)}<div class="nm">${esc(m.name)}${isMe ? "<small>あなた</small>" : ""}</div></div>` + days.map(d => { const k = ymd(d); const evs = S.events.filter(e => onDay(e,k) && (e.memberIds||[]).includes(m.id) && !e.allCompany).sort(cmpEv); return `<div class="cell ${dayClass(d).filter(c=>c!=="sun"&&c!=="sat").join(" ")}" data-add="${m.id}|${k}">${evs.map(e => chip(e, clash, k)).join("")}<span class="add" aria-hidden="true">${ic("plus")}</span></div>`; }).join("");
    }
    if(!filteredMembers().length) rows = `<div class="rowhead" style="grid-column:1/-1">表示するメンバーがいません。設定でメンバーを登録し、利用者を選んでください。</div>`;
  }
  return `<div class="week">${head}${band}${rows}</div>`;
}
function monthGrid(){
  const clash = clashSet();
  const first = new Date(S.anchor.getFullYear(), S.anchor.getMonth(), 1);
  const start = mondayOf(first);
  const ids = new Set(filteredMembers().map(m => m.id));
  let html = ["月","火","水","木","金","土","日"].map((w,i) => `<div class="mh ${i===5?"sat":i===6?"sun":""}">${w}</div>`).join("");
  for(let i=0;i<42;i++){
    const d = addDays(start, i), k = ymd(d);
    if(i === 35 && d.getMonth() !== first.getMonth()) break;
    const evs = S.events.filter(e => onDay(e,k) && (e.allCompany || (e.memberIds||[]).some(id => ids.has(id)))).sort(cmpEv);
    const out = d.getMonth() !== first.getMonth();
    html += `<div class="mcell ${out?"out":""} ${dayClass(d).join(" ")}" data-add="${S.filter!=="all"&&S.filter!=="me"?S.filter:(S.meId||"")}|${k}"><div class="dn num">${d.getDate()}${HOLIDAYS[k]?`<small>${HOLIDAYS[k]}</small>`:""}</div>${evs.slice(0,4).map(e => chip(e, clash, k)).join("")}${evs.length>4?`<span class="more">ほか${evs.length-4}件</span>`:""}</div>`;
  }
  return `<div class="month">${html}</div>`;
}
function mobileSched(days){
  if(!days.some(d => ymd(d) === S.mDay)) S.mDay = ymd(days[0]);
  const ids = new Set(filteredMembers().map(m => m.id));
  const evsFor = k => S.events.filter(e => onDay(e,k) && (e.allCompany || (e.memberIds||[]).some(id => ids.has(id)))).sort(cmpEv);
  const strip = days.map(d => { const k = ymd(d); const n = Math.min(evsFor(k).length, 4); return `<button class="${dayClass(d).join(" ")}" data-mday="${k}" aria-pressed="${k===S.mDay}"><span>${WD[d.getDay()]}</span><b class="num">${d.getDate()}</b><span class="dots">${"<i></i>".repeat(n)}</span></button>`; }).join("");
  const list = evsFor(S.mDay);
  const opts = [["all","全員"],["me","自分だけ"], ...sortedMembers().map(m => [m.id, m.name])];
  return `<div class="m-sched">
    <div class="toolbar">
      <button class="icon-btn" data-shift="-1" aria-label="前の週">${ic("left")}</button>
      <button class="btn sm" data-shift="0">今日</button>

    </div>
    <div class="daystrip">${strip}</div>
    <h2 style="font-size:16px;margin:4px 0 10px" class="num">${md(S.mDay)}${HOLIDAYS[S.mDay]?`　<span style="color:var(--bad);font-size:13px">${HOLIDAYS[S.mDay]}</span>`:""}</h2>
    <div class="m-list">${list.length ? list.map(e => `<button class="m-item" data-ev="${esc(e.id)}"><span class="tm num">${esc(timeLabel(e))}</span><span><span class="ttl"><span class="dot" style="${catVar(e.category)}"></span>${e.private ? `<span class="lk">${ic("lock")}</span>` : ""}${esc(e.title)}</span><span class="who">${e.allCompany ? "全社" : (e.memberIds||[]).map(id => `${av(id,true)}${esc(famName(id))}`).join(" ")}${(e.facilityIds||[]).length ? "・" + e.facilityIds.map(f => esc((fac(f)||{}).name||"")).join("、") : ""}</span></span></button>`).join("") : `<div class="empty">この日の予定はありません。</div>`}</div>
  </div>`;
}

/* ============ モーダル共通 ============ */
function openModal(html, type, data){
  S.modal = {type, data};
  $("#layer").innerHTML = `<div class="scrim" data-scrim>${html}</div>`;
  const first = $("#layer [autofocus]") || $("#layer input, #layer select, #layer button");
  if(first) setTimeout(() => first.focus(), 30);
}
function closeModal(){ S.modal = null; $("#layer").innerHTML = ""; render(); }
function confirmBox(msg, okLabel = "OK", danger = false){
  return new Promise(res => {
    const wrap = document.createElement("div");
    wrap.className = "scrim"; wrap.style.zIndex = 70;
    wrap.innerHTML = `<div class="modal" style="width:min(420px,100%)" role="alertdialog" aria-modal="true"><div class="mbody"><p style="margin:0;font-size:15px">${esc(msg)}</p></div><footer><span class="spacer"></span><button class="btn" data-no>やめる</button><button class="btn ${danger?"danger":"primary"}" data-yes>${esc(okLabel)}</button></footer></div>`;
    document.body.appendChild(wrap);
    wrap.querySelector("[data-yes]").focus();
    wrap.addEventListener("click", e => {
      if(e.target.closest("[data-yes]")){ wrap.remove(); res(true); }
      else if(e.target.closest("[data-no]") || e.target === wrap){ wrap.remove(); res(false); }
    });
  });
}
let toastTimer;
function toast(msg){
  $$(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}

function syncPrivateUi(){
  const p = $("#evPrivate"); if(!p) return;
  const on = p.checked;
  $$("#evMembers input, #evFacs input").forEach(i => { i.disabled = on; });
  $("#evMembers").style.opacity = $("#evFacs").style.opacity = on ? ".45" : "";
  let note = $("#evPrivNote");
  if(on && !note){ note = document.createElement("div"); note.id = "evPrivNote"; note.className = "alert-box info"; note.innerHTML = `${ic("lock")}<span>内容はあなたにだけ表示されます。ほかの人の画面では、この時間が「予定あり」とだけ表示されます。参加者・施設は選べません（社用車や会議室を使うときは、重複予約を防ぐため公開の予定で登録してください）。</span>`; $("#evFacs").parentNode.after(note); }
  if(!on && note) note.remove();
  updateClash();
}
function readEventForm(){
  const v = id => ($("#" + id) || {}).value || "";
  const allDay = $("#evAllDay").checked;
  const priv = !!($("#evPrivate") && $("#evPrivate").checked);
  return {
    title: v("evTitle").trim(), category: ($("input[name=evCat]:checked") || {}).value || "その他",
    date: v("evDate"), endDate: v("evEndDate") && v("evEndDate") > v("evDate") ? v("evEndDate") : "",
    allDay, start: allDay ? "" : v("evStart"), end: allDay ? "" : v("evEnd"),
    memberIds: priv ? (S.meId ? [S.meId] : []) : $$("#evMembers input:checked").map(i => i.value),
    facilityIds: priv ? [] : $$("#evFacs input:checked").map(i => i.value),
    company: v("evCompany").trim(), memo: v("evMemo").trim(), allCompany: priv ? false : $("#evAllCo").checked,
    private: priv
  };
}
function updateClash(){
  const box = $("#evClash"); if(!box) return;
  const E = readEventForm(); E.id = S.modal.data.id;
  const hits = [];
  for(const o of S.events){
    if(o.id === E.id) continue;
    const common = (o.facilityIds||[]).filter(f => E.facilityIds.includes(f));
    if(common.length && E.date && overlaps(E, o)) hits.push({o, common});
  }
  box.innerHTML = hits.length ? `<div class="alert-box bad" style="margin-top:6px">${ic("warn")}<span><b>重複しています：</b>${hits.map(h => `${esc(h.common.map(f => fac(f).name).join("、"))} は ${md(h.o.date)} ${esc(timeLabel(h.o))}「${esc(h.o.title)}」（${esc((h.o.memberIds||[]).map(famName).join("・"))}）で予約済み`).join("<br>")}</span></div>` : "";
}
async function saveEvent(){
  const E = readEventForm(); const err = $("#evErr");
  const problems = [];
  if(!E.title) problems.push("予定の内容を入力してください。");
  if(!E.date) problems.push("日付を選んでください。");
  if(!E.allDay && E.start && E.end && E.end <= E.start && !E.endDate) problems.push("終了時刻は開始時刻より後にしてください。");
  if(!E.allCompany && !E.memberIds.length) problems.push("参加者を1人以上選ぶか、「全社の予定にする」にチェックしてください。");
  if(problems.length){ err.hidden = false; err.innerHTML = problems.map(esc).join("<br>"); return; }
  const id = S.modal.data.id || uid("ev");
  const orig = S.modal.data.orig || {};
  const body = {...orig, ...E, updatedAt: nowIso(), updatedBy: S.meId || ""};
  if(!orig.createdAt){ body.createdAt = nowIso(); body.createdBy = S.meId || ""; }
  delete body.id;
  const wasEdit = !!S.modal.data.id;
  if(E.private && !S.meId){ err.hidden = false; err.textContent = "非公開の予定を入れるには、先に「あなた」を選んでください。"; return; }
  try {
    if(E.private){
      await put("privEvents", id, body);          // 内容つき（本人だけ）
      await put("events", id, busyBody(E, orig)); // 「予定あり」だけ（みんな）
    } else {
      await put("events", id, body);              // 公開（予定ありの枠も上書きされる）
      if(orig.private) await del("privEvents", id);
    }
    closeModal(); toast(E.private ? "自分だけの予定として保存しました" : wasEdit ? "予定を更新しました" : "予定を保存しました");
  } catch(e){}
}

function sheetHtml(t, opts = {}){

async function submitTrip(){

  if(!T.arrange) p.push("手配方法を選んでください。");
  if(p.length){ err.hidden = false; err.innerHTML = p.map(esc).join("<br>"); err.scrollIntoView({block:"nearest"}); return; }
  const resub = S.modal.data.resubmitId;

    history: prev ? [...(prev.history||[]), {steps: prev.steps, status: prev.status, at: nowIso()}] : [],

async function autoSchedule(id, t){
