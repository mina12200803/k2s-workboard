      ${st.k === "returned" ? `<button class="btn primary sm" data-act="trip-resubmit">修正して再申請</button>` : ""}
      ${["pending","returned"].includes(st.k) ? `<button class="btn sm" data-act="trip-withdraw">取り下げる</button>` : ""}
      <button class="btn sm ghost" data-act="trip-copy">${ic("copy")}この内容で新しく申請</button></div>` : "";
  box.innerHTML = `
    <header><h2 id="tdT">出張申請 No.${esc(t.no)}</h2>${pill(t)}<button class="icon-btn" data-close aria-label="閉じる">${ic("x")}</button></header>
    <div class="mbody"><div class="td">
      <div style="min-width:0">${sheetHtml(t)}</div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        ${act}
        <div><h3 style="font-size:14px;margin-bottom:10px">進行状況</h3>${flow}</div>
        ${t.eventId ? `<button class="btn sm" data-ev="${esc(t.eventId)}">${ic("cal")}スケジュールの出張予定を見る</button>` : ""}
        ${ownerActs}
      </div>
    </div></div>`;
}
async function tripAct(kind){
  const t = S.trips.find(x => x.id === S.modal.data.id); if(!t) return;
  const st = tripState(t); if(st.cur === undefined) return;
  const comment = ($("#tdCmt") || {}).value.trim();
  if((kind === "差し戻し" || kind === "却下") && !comment){ toast("差し戻し・却下のときは、理由をコメントに書いてください"); $("#tdCmt").focus(); return; }
  if(kind === "却下" && !(await confirmBox("この申請を却下します。よろしいですか？", "却下する", true))) return;
  const next = clone(t); delete next.id;
  const step = next.steps[st.cur];
  step.result = kind === "ok" ? step.kind : kind; step.comment = comment; step.at = nowIso(); step.by = S.meId;
  if(kind === "差し戻し") next.status = "returned";
  else if(kind === "却下") next.status = "rejected";
  else next.status = next.steps.every(s => s.result) ? "done" : "pending";
  next.updatedAt = nowIso();
  const ns = tripState(next);
  try {
    if(["decided","done"].includes(ns.k)) await autoSchedule(t.id, next);
    await put("trips", t.id, next);
    toast(kind === "ok" ? `${step.kind}しました` : kind === "差し戻し" ? "差し戻しました" : "却下しました");
  } catch(e){}
}

/* ============ イベント処理 ============ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-nav],[data-act],[data-ev],[data-trip],[data-add],[data-smode],[data-shift],[data-ttab],[data-mday],[data-pickme],[data-close],[data-tp],[data-mdel]");
  if(!el){ if(e.target.matches("[data-scrim]") && S.modal && S.modal.type !== "who") closeModal(); return; }
  if(el.dataset.close !== undefined){ closeModal(); return; }
  if(el.dataset.nav){ S.view = el.dataset.nav; ls.set("k2s-view", S.view); if(el.dataset.tab) S.tripTab = el.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(el.dataset.ev){
    const ev = S.events.find(x => x.id === el.dataset.ev);
    if(!ev){ toast("この予定は削除されています"); return; }
    e.stopPropagation();
    if(ev.busy){ toast(`${memName((ev.memberIds||[])[0])}さんの非公開の予定です（内容は本人だけが見られます）`); return; }
    openEvent(ev); return;
  }
  if(el.dataset.trip){ e.stopPropagation(); openTripDetail(el.dataset.trip); return; }
  if(el.dataset.add !== undefined){
    const [who, date] = el.dataset.add.split("|");
    if(who === "all") openEvent(null, {date, allCompany:true});
    else if(who.startsWith("fac:")) openEvent(null, {date, facId: who.slice(4)});
    else openEvent(null, {date, memberId: who || S.meId});
    return;
  }
  if(el.dataset.smode){ S.schedMode = el.dataset.smode; ls.set("k2s-smode", S.schedMode); render(); return; }
  if(el.dataset.shift !== undefined){
    const n = Number(el.dataset.shift);
    if(n === 0){ S.anchor = new Date(); S.mDay = todayStr(); }
    else if(S.schedMode === "month" && getComputedStyle($(".d-sched") || document.body).display !== "none") S.anchor = new Date(S.anchor.getFullYear(), S.anchor.getMonth() + n, 1);
    else { S.anchor = addDays(S.anchor, 7*n); S.mDay = ymd(addDays(fromYmd(S.mDay), 7*n)); }
    render(); return;
  }
  if(el.dataset.ttab){ S.tripTab = el.dataset.ttab; render(); return; }
  if(el.dataset.mday){ S.mDay = el.dataset.mday; render(); return; }
  if(el.dataset.pickme){ await setMe(el.dataset.pickme); closeModal(); toast(`${memName(el.dataset.pickme)}さんとして利用します`); return; }
  if(el.dataset.tp){ const [a,b] = el.dataset.tp.split("-"); $("#evAllDay").checked = false; $("#evStart").disabled = $("#evEnd").disabled = false; $("#evStart").value = a; $("#evEnd").value = b; updateClash(); return; }
  if(el.dataset.mdel){
    const m = mem(el.dataset.mdel); if(!m) return;
    if(await confirmBox(`${m.name}さんをメンバーから外します。過去の予定や申請はそのまま残ります。`, "外す", true)){ try { const em = emailOf(m.id); await del("members", m.id); if(S.mode === "db" && em) await del("allow", em.toLowerCase()); toast("メンバーから外しました（このアドレスではログインできなくなります）"); } catch(e){} }
    return;
  }
  const a = el.dataset.act;
  if(a === "who"){ if(S.mode === "db" && S.meId){ S.view = "settings"; render(); } else openWho(); }
  else if(a === "logout-now"){ AUTH.signOut(); }
  else if(a === "signup-toggle"){ S.signup = !S.signup; $("#root").innerHTML = viewLogin(); }
  else if(a === "pw-reset") doReset();
  else if(a === "import-cz") importCybozu(el);
  else if(a === "seed"){
    el.disabled = true;
    try {
      for(const [id, m] of Object.entries(LOCAL_SEED.members)) if(!mem(id)) await put("members", id, m.color ? {name:m.name, order:m.order, color:m.color} : {name:m.name, order:m.order});
      if(!S.route.managerId && !S.route.presidentId) await putRoute({...LOCAL_SEED.config.route});
      closeModal(); toast("社員と承認ルートを登録しました");
    } catch(e){ el.disabled = false; }
  }
  else if(a === "logout"){ if(await confirmBox("ログアウトします。", "ログアウト")) AUTH.signOut(); }
  else if(a === "reset-local"){ if(await confirmBox("この端末に保存したお試しデータをすべて消して、最初の状態に戻します。", "消す", true)){ try { localStorage.removeItem("k2s-local-v1"); localStorage.removeItem("k2s-me"); } catch(e){} location.reload(); } }
  else if(a === "who-add"){
    const name = $("#whoNewName").value.trim(); if(!name){ toast("氏名を入力してください"); $("#whoNewName").focus(); return; }
    const id = uid("m"); const order = Math.max(0, ...S.members.map(m => m.order||0)) + 1;
    try { await put("members", id, {name, order}); await setMe(id); closeModal(); toast(`${name}さんとして利用します`); } catch(e){}
  }
  else if(a === "new-event") openEvent(null, {date: S.view === "schedule" ? S.mDay : todayStr()});
  else if(a === "new-trip"){ if(!S.meId) openWho(); else openTripForm(); }
  else if(a === "ev-del"){
    const ev = S.modal.data.orig;
    if(await confirmBox(`「${ev.title}」を削除します。元に戻せません。`, "削除する", true)){ try { if(ev.private) await del("privEvents", ev.id); await del("events", ev.id); closeModal(); toast("予定を削除しました"); } catch(e){} }
  }
  else if(a === "ev-dup"){ const ev = clone(S.modal.data.orig); delete ev.id; delete ev.tripId; delete ev.createdAt; S.modal = null; openEvent(null); fillEventForm(ev); }
  else if(a === "trip-ok") tripAct("ok");
  else if(a === "trip-return") tripAct("差し戻し");
  else if(a === "trip-reject") tripAct("却下");
  else if(a === "trip-withdraw"){
    const t = S.trips.find(x => x.id === S.modal.data.id);
    if(t && await confirmBox("この申請を取り下げます。承認の処理は止まります。", "取り下げる", true)){ const n = clone(t); delete n.id; n.status = "withdrawn"; n.updatedAt = nowIso(); try { await put("trips", t.id, n); toast("取り下げました"); } catch(e){} }
  }
  else if(a === "trip-resubmit"){ const t = S.trips.find(x => x.id === S.modal.data.id); if(t) openTripForm(t, t.id); }
  else if(a === "trip-copy"){ const t = S.trips.find(x => x.id === S.modal.data.id); if(t) openTripForm(t); }
  else if(a === "save-route"){ try { await putRoute({managerId:$("#rtMgr").value, presidentId:$("#rtPres").value, accountingId:$("#rtAcc").value}); toast("承認ルートを保存しました"); } catch(e){} }
  else if(a === "add-mem"){
    const name = $("#newMemName").value.trim(); if(!name){ toast("氏名を入力してください"); $("#newMemName").focus(); return; }
    const order = Math.max(0, ...S.members.map(m => m.order||0)) + 1;
    const email = ($("#newMemEmail") || {}).value ? $("#newMemEmail").value.trim() : "";
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast("メールアドレスの形が正しくありません"); return; }
    const nid = uid("m");
    try { await put("members", nid, {name, order}); if(email) await setMemberEmail(nid, email); toast(`${name}さんを追加しました`); } catch(e){}
  }
});
function fillEventForm(ev){
  $("#evTitle").value = ev.title || ""; const r = $(`input[name=evCat][value="${ev.category}"]`); if(r) r.checked = true;
  $("#evDate").value = ev.date || todayStr(); $("#evEndDate").value = ev.endDate || "";
  $("#evAllDay").checked = !!ev.allDay; $("#evStart").disabled = $("#evEnd").disabled = !!ev.allDay;
  $("#evStart").value = ev.start || ""; $("#evEnd").value = ev.end || "";
  $$("#evMembers input").forEach(i => i.checked = (ev.memberIds||[]).includes(i.value));
  $$("#evFacs input").forEach(i => i.checked = (ev.facilityIds||[]).includes(i.value));
  $("#evCompany").value = ev.company || ""; $("#evMemo").value = ev.memo || ""; $("#evAllCo").checked = !!ev.allCompany;
  $("#evPrivate").checked = !!ev.private;
  syncPrivateUi();
}
document.addEventListener("submit", e => {
  if(e.target.id === "evForm"){ e.preventDefault(); saveEvent(); }
  if(e.target.id === "tripForm"){ e.preventDefault(); submitTrip(); }
  if(e.target.id === "loginForm"){ e.preventDefault(); S.signup ? doSignup() : doLogin(); }
});
document.addEventListener("input", e => {
  if(e.target.closest("#evForm")) updateClash();
  if(e.target.closest("#tripForm")) updateTripPreview();
});
document.addEventListener("change", async e => {
  const t = e.target;
  if(t.id === "evAllDay"){ $("#evStart").disabled = $("#evEnd").disabled = t.checked; updateClash(); }
  if(t.id === "evPrivate" || t.id === "evAllCo"){ if(t.checked) $(t.id === "evPrivate" ? "#evAllCo" : "#evPrivate").checked = false; syncPrivateUi(); }
  if(t.id === "evStart" && $("#evEnd").value && $("#evEnd").value <= t.value){ const i = TIMES.indexOf(t.value); $("#evEnd").value = TIMES[Math.min(i+4, TIMES.length-1)]; }
  if(t.id === "evDate"){ const end = $("#evEndDate"); if(end.value && end.value < t.value) end.value = ""; }
  if(t.closest && t.closest("#evForm")) updateClash();
  if(t.id === "tpDepDate"){ const r = $("#tpRetDate"); if(!r.value || r.value < t.value) r.value = t.value; }
  if(t.closest && t.closest("#tripForm")) updateTripPreview();
  if(t.id === "filterSel" || t.id === "filterSelM"){ S.filter = t.value; ls.set("k2s-filter", S.filter); render(); }
  if(t.dataset.memail){
    const v = t.value.trim();
    if(v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ toast("メールアドレスの形が正しくありません"); return; }
    try { await setMemberEmail(t.dataset.memail, v); toast(v ? "メールアドレスを登録しました。この人はこのアドレスでログインできます" : "メールアドレスを外しました"); } catch(e){}
    return;
  }
  if(t.dataset.mname){
    const id = t.dataset.mname; const m = mem(id); if(!m) return;
    const name = t.value.trim();
    if(!name){ toast("氏名は空にできません"); t.value = m.name; return; }
    const body = {...m, name}; delete body.id; delete body.title;
    try { await put("members", id, body); toast("保存しました"); } catch(e){}
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && S.modal && S.modal.type !== "who" && !document.querySelector('[role="alertdialog"]')) closeModal();
});

// 最初のページの合言葉（社外の人が迷い込まないための入口。本当の守りはログインとサーバー側のルール）
const PASSPHRASE = "k2s";
function showGate(){
  $("#root").innerHTML = `<div class="login"><div class="login-card">
    <div class="brand-mark big">K2S</div><h1>ワークボード</h1>
    <p class="note" style="margin:0 0 18px">社内専用のページです。合言葉を入力してください。</p>
    <form id="gateForm" novalidate style="display:flex;flex-direction:column;gap:12px;text-align:left">
      <label class="field"><span>合言葉</span><input class="inp" id="gateIn" type="password" autocomplete="off" autocapitalize="off" autofocus></label>
      <p id="gateErr" class="alert-box bad" hidden>合言葉が違います。</p>
      <button class="btn primary" type="submit" style="justify-content:center;height:44px">入る</button>
    </form>
    <p class="note" style="margin-top:14px">一度入ると、この端末では次回から聞かれません。</p>
  </div></div>`;
  setTimeout(() => $("#gateIn") && $("#gateIn").focus(), 30);
  $("#gateForm").addEventListener("submit", e => {
    e.preventDefault();
    if($("#gateIn").value.trim().toLowerCase() === PASSPHRASE){ ls.set("k2s-gate", "ok"); initStore(); }
    else { $("#gateErr").hidden = false; $("#gateIn").select(); }
  });
}
if(ls.get("k2s-gate") === "ok") initStore(); else showGate();
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
